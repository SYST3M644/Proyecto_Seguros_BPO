name: Seguros BPO - Android y Microservicios Java

on:
  push:
    branches:
      - main
      - feature/entrega-microservicios-retrofit-20261117
    paths:
      - 'app/**'
      - 'backend-java/**'
      - '.github/workflows/seguros-bpo-integracion-oficial.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend-java/**'
      - '.github/workflows/seguros-bpo-integracion-oficial.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Instalar SDK Android
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager 'platforms;android-37.2'
      - name: Compilar Android y ejecutar pruebas unitarias
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Publicar APK de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: seguros-bpo-oficial-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Microservicios y pruebas Java
        working-directory: backend-java
        run: mvn -B -ntp clean verify

  integracion-http:
    needs: [android, java]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Levantar backend
        working-directory: backend-java
        run: docker compose up --build -d --wait --wait-timeout 210
      - name: Validar gateway y REST
        working-directory: backend-java
        run: |
          bash scripts/docker-smoke.sh
          bash scripts/docker-e2e.sh
      - name: Detener backend
        if: always()
        working-directory: backend-java
        run: docker compose down --remove-orphans

  android-emulador:
    needs: [android, java]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: SDK Android
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          sdkmanager 'platforms;android-37.2'
      - name: Levantar backend
        working-directory: backend-java
        run: docker compose up --build -d --wait --wait-timeout 210
      - name: Aceleracion de emulador
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Reportar y consultar un siniestro real desde Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Resultados instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguros-bpo-oficial-emulador
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn
      - name: Detener backend
        if: always()
        working-directory: backend-java
        run: docker compose down --remove-orphans
